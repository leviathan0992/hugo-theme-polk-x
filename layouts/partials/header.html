<header class="header">
  <div class="blog-title">
    <a href="{{ "/" | relLangURL }}" class="logo">{{ .Site.Title }}</a>
    <div class="subtitle">{{ .Site.Params.subtitle | default "" }}</div>
  </div>
  <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" aria-pressed="false">
    <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
  </button>
  <nav class="navbar" aria-label="主导航">
    <ul class="menu">
      {{- range .Site.Menus.main -}}
        <li class="menu-item">
          <a href="{{ .URL }}" class="menu-item-link">{{ .Name }}</a>
        </li>
      {{- end -}}
    </ul>
  </nav>
</header>
