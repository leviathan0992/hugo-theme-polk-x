<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default .Site.Language.Lang | default "en" }}">
  {{ partial "head.html" . }}
  <body id="top">
    <div class="container">
      {{ block "main" . }}{{ end }}
    </div>
    {{- $js := resources.Get "js/main.js" | fingerprint }}
    <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
  </body>
</html>
